name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# WR-07, half one. With no `permissions:` block every job here ran with the
# repository's DEFAULT GITHUB_TOKEN scope, which on many repositories is write.
# Declared at workflow level so it applies to all three jobs and a new job
# cannot inherit write by being added without one.
#
# `contents: read` is the whole requirement, and that was checked rather than
# assumed: no step opens a pull request, writes a comment, pushes a tag or
# publishes a package. The artifact upload in `e2e` does NOT need
# `actions: read` or `actions: write` — actions/upload-artifact v4 authenticates
# to the artifact service with the runner's ACTIONS_RUNTIME_TOKEN, not with
# GITHUB_TOKEN, and its README documents no `permissions` requirement. If a
# future step needs more, add the narrowest scope to THAT JOB, not here.
permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-key"

# WR-07, half two — THIRD-PARTY ACTIONS ARE PINNED BY COMMIT SHA, NOT BY TAG.
# A tag is a mutable pointer: `@v4` can be force-moved to any commit by whoever
# owns the repository or by whoever compromises it, and the moved code then runs
# inside this workflow with whatever the token above allows. The Supabase CLI
# *version* was already pinned (2.115.0, for a good reason); the action that
# INSTALLS it was not, so the pinning discipline stopped one level short.
#
# Every SHA below was resolved with
#   gh api repos/<owner>/<repo>/git/ref/tags/<tag>
# dereferencing the annotated-tag object where the ref pointed at one, so the
# comment names the tag a human can check and the SHA is what actually runs.
# The MAJOR line is unchanged — this commit pins, it does not upgrade.
#
# To move one of these: resolve the new SHA the same way, update BOTH the SHA
# and its `# vN.N.N` comment, and never replace a SHA with a bare tag.
jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Migration filename parse check
        run: node scripts/check-migration-filenames.mjs

      - name: Run tests
        run: npm test

      - name: Production vulnerability gate
        run: npm audit --audit-level=high --omit=dev

      - name: Run build
        run: npm run build

  # REFAC-04 / D-04. A sibling of `ci`, never a step inside it: this job starts a
  # Docker stack and the fast job must not wait on Docker to report a lint failure.
  #
  # The gate generates from the LOCAL database built by the migrations, never from
  # the linked remote project. A gate reading production would pass on day one and
  # prove nothing forever; a local gate fails the moment a migration and the committed
  # types disagree, and it needs no production credential to run.
  #
  # The CLI version is pinned because the generator's output is not stable across
  # versions — postgres-meta v0.99.0 parenthesises generic constraints that v0.98.0
  # leaves bare. 2.115.0 is the CLI that produced the committed file.
  types:
    name: Schema truth — type drift gate and database tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520  # v3.0.0
        with:
          version: 2.115.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Rebuild the local database from the migrations
        run: supabase db reset --local

      - name: Regenerate types from the reconciled schema
        run: supabase gen types typescript --local --schema public > /tmp/types.gen.ts

      - name: Fail on type drift
        run: diff -u src/lib/supabase/types.ts /tmp/types.gen.ts

      - name: RLS and schema tests
        run: supabase test db --local

  # REFAC-06 / plan 03-07. A THIRD sibling, never a step inside `ci`: this job
  # starts Docker, resets a database, loads a seed and downloads a browser, and
  # the fast job must not wait on any of that to report a lint failure. The same
  # reasoning plan 03-06 gave for the `types` job applies here unchanged, and
  # neither of those two jobs is touched by this one.
  #
  # ORDER IS LOAD-BEARING. `supabase db reset` wipes the database, so the seed is
  # loaded AFTER it and never before. The seed cannot live in `supabase/seed.sql`
  # — that file executes INSIDE the reset, before any process can call the admin
  # API to create the persona accounts the public rows reference — which is why
  # `supabase/seed.sql` does not exist and must stay that way.
  #
  # `supabase test db` runs here too, and it is a different run from the one in
  # the `types` job: there the database is unseeded and 040-seed-coverage.test.sql
  # emits 21 TAP SKIPs with their reason; here the seed is loaded and the same 21
  # assertions execute for real.
  #
  # The application is served from a PRODUCTION BUILD. Under `next dev` the pages
  # never finish hydrating in Playwright's Chromium — the Turbopack HMR handshake
  # fails and the auth store never initializes — so `playwright.config.ts` runs
  # `npm run build && npm run start`. NEXT_PUBLIC_SUPABASE_URL is taken from the
  # local stack and passed explicitly; the config hands it to the seed loader's
  # own guard, which refuses any non-local target.
  #
  # No `continue-on-error` anywhere. A red end-to-end suite is a red build.
  e2e:
    name: Persona harness — end-to-end specs against the seeded local stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520  # v3.0.0
        with:
          version: 2.115.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Rebuild the local database from the migrations
        run: supabase db reset --local

      - name: Load the deterministic seed
        run: npx tsx scripts/seed/load.ts

      - name: Seed coverage and RLS assertions
        run: supabase test db --local

      - name: Install the browser engine
        run: npx playwright install --with-deps chromium

      - name: Run the persona harness
        run: npx playwright test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
